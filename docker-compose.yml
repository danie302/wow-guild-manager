# Local development stack. Usage: cp .env.example .env && docker compose up

# api, bot, and worker run the same server image (built by the deps service) with different commands.
x-server: &server
  image: wgm-server-dev
  pull_policy: never
  init: true
  env_file: .env
  environment:
    NODE_ENV: development
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # Used only by the tests, which drop and recreate it on every run.
    TEST_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
    REDIS_URL: redis://redis:6379
  volumes: &app-volumes
    - .:/app
    - node_modules:/app/node_modules
    - web_node_modules:/app/apps/web/node_modules
    - server_node_modules:/app/apps/server/node_modules
    - shared_node_modules:/app/packages/shared/node_modules
  depends_on:
    deps:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # Installs dependencies into the node_modules volumes, then exits.
  # Runs on every `up`, so new dependencies in pnpm-lock.yaml are picked up.
  deps:
    image: wgm-server-dev
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: dev
    command: pnpm install --frozen-lockfile --store-dir /app/node_modules/.pnpm-store --config.confirmModulesPurge=false
    volumes: *app-volumes

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    image: wgm-web-dev
    init: true
    command: pnpm --filter @wgm/web dev
    environment:
      # Vite forwards /api requests to the api container.
      API_PROXY_TARGET: http://api:3000
    ports:
      - ${WEB_PORT:-5173}:5173
    volumes: *app-volumes
    depends_on:
      deps:
        condition: service_completed_successfully

  api:
    <<: *server
    # Runs tsx without pnpm in between: pnpm kills its children with SIGKILL on SIGTERM,
    # which would skip the graceful shutdown (closing connections, leaving Discord).
    # Migrations run before the server starts; bot and worker never run them.
    command: sh -c "cd apps/server && node_modules/.bin/sequelize-cli db:migrate && exec node_modules/.bin/tsx watch --include src --include ../../packages/shared/src src/entrypoints/api.ts"
    ports:
      - ${API_PORT:-3000}:3000

  bot:
    <<: *server
    command: sh -c "cd apps/server && exec node_modules/.bin/tsx watch --include src --include ../../packages/shared/src src/entrypoints/bot.ts"

  worker:
    <<: *server
    command: sh -c "cd apps/server && exec node_modules/.bin/tsx watch --include src --include ../../packages/shared/src src/entrypoints/worker.ts"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    volumes:
      # PostgreSQL 18+ images keep their data under this directory.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    # Append-only file persistence, so queued jobs survive a restart.
    command: redis-server --appendonly yes
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  node_modules:
  web_node_modules:
  server_node_modules:
  shared_node_modules:
