<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-label="Architecture diagram: the web client and Discord reach a backend with Auth, an API server, a Discord bot, and a worker. All three services use the same domain rules, which read and write the database and the cache server. The worker calls the Battle.net API.">
  <title>WoW Guild Manager architecture</title>
  <style>
    text { font-family: "IBM Plex Sans", -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1b2130; stroke-width: 1.4; }
    .ext { fill: #f6f7f9; stroke: #5b6475; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .disc { fill: #f6f7f9; stroke: #4f5bd5; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .group { fill: none; stroke: #cfd5df; stroke-width: 1.4; stroke-dasharray: 3 4; }
    .core { fill: #f4ead6; stroke: #a8741a; stroke-width: 1.8; }
    .edge { fill: none; stroke: #1b2130; stroke-width: 1.3; }
    .edge.d { stroke: #4f5bd5; }
    .edge.a { stroke: #a8741a; }
    .t { fill: #1b2130; font-size: 13px; font-weight: 600; }
    .s { fill: #5b6475; font-size: 11.5px; }
    .lbl { fill: #5b6475; font-family: "IBM Plex Mono", Menlo, monospace; font-size: 10.5px; }
    .hdr { fill: #5b6475; font-family: "IBM Plex Mono", Menlo, monospace; font-size: 11px; letter-spacing: .1em; }
    .coret { fill: #a8741a; font-size: 13px; font-weight: 600; }
    .cores { fill: #1b2130; font-size: 11.5px; }
    .leg { fill: #5b6475; font-size: 12px; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#1b2130" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#4f5bd5" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path fill="#a8741a" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="640"/>

  <!-- Column headers -->
  <text class="hdr" x="120" y="22" text-anchor="middle">CLIENTS</text>
  <text class="hdr" x="350" y="22" text-anchor="middle">DISCORD</text>
  <text class="hdr" x="680" y="22" text-anchor="middle">OUR BACKEND</text>
  <text class="hdr" x="1000" y="22" text-anchor="middle">DATA AND EXTERNAL API</text>

  <!-- Backend group -->
  <rect class="group" x="500" y="40" width="360" height="530" rx="12"/>

  <!-- Clients -->
  <rect class="box" x="40" y="150" width="160" height="80" rx="8"/>
  <text class="t" x="120" y="185" text-anchor="middle">Web client</text>
  <text class="s" x="120" y="204" text-anchor="middle">GM, Officers, members</text>
  <text class="s" x="120" y="220" text-anchor="middle">(members read-only)</text>

  <rect class="box" x="40" y="400" width="160" height="80" rx="8"/>
  <text class="t" x="120" y="435" text-anchor="middle">Discord app</text>
  <text class="s" x="120" y="454" text-anchor="middle">Members</text>

  <!-- Discord platform -->
  <rect class="disc" x="260" y="60" width="180" height="60" rx="8"/>
  <text class="t" x="350" y="86" text-anchor="middle">Discord OAuth2</text>
  <text class="s" x="350" y="104" text-anchor="middle">login</text>

  <rect class="disc" x="260" y="300" width="180" height="250" rx="8"/>
  <text class="t" x="350" y="420" text-anchor="middle">Discord</text>
  <text class="s" x="350" y="439" text-anchor="middle">Gateway and API</text>

  <!-- Backend services -->
  <rect class="box" x="520" y="60" width="170" height="60" rx="8"/>
  <text class="t" x="605" y="86" text-anchor="middle">Auth</text>
  <text class="s" x="605" y="104" text-anchor="middle">session and access level</text>

  <rect class="box" x="520" y="160" width="170" height="80" rx="8"/>
  <text class="t" x="605" y="195" text-anchor="middle">API server</text>
  <text class="s" x="605" y="214" text-anchor="middle">web client endpoints</text>

  <rect class="box" x="520" y="320" width="170" height="80" rx="8"/>
  <text class="t" x="605" y="355" text-anchor="middle">Discord bot</text>
  <text class="s" x="605" y="374" text-anchor="middle">buttons and commands</text>

  <rect class="box" x="520" y="470" width="170" height="80" rx="8"/>
  <text class="t" x="605" y="505" text-anchor="middle">Worker and scheduler</text>
  <text class="s" x="605" y="524" text-anchor="middle">scheduled jobs</text>

  <!-- Domain core -->
  <rect class="core" x="730" y="160" width="110" height="290" rx="8"/>
  <text class="coret" x="785" y="196" text-anchor="middle">Domain</text>
  <text class="coret" x="785" y="213" text-anchor="middle">rules</text>
  <text class="cores" x="785" y="250" text-anchor="middle">roles by class</text>
  <text class="cores" x="785" y="272" text-anchor="middle">slots</text>
  <text class="cores" x="785" y="294" text-anchor="middle">waitlist</text>
  <text class="cores" x="785" y="316" text-anchor="middle">24-hour rule</text>
  <text class="cores" x="785" y="338" text-anchor="middle">permissions</text>
  <text class="cores" x="785" y="360" text-anchor="middle">attendance</text>

  <!-- Data and external API -->
  <rect class="box" x="920" y="170" width="160" height="80" rx="8"/>
  <text class="t" x="1000" y="205" text-anchor="middle">Database</text>
  <text class="s" x="1000" y="224" text-anchor="middle">guild data</text>

  <rect class="box" x="920" y="330" width="160" height="80" rx="8"/>
  <text class="t" x="1000" y="365" text-anchor="middle">Cache server</text>
  <text class="s" x="1000" y="384" text-anchor="middle">sessions and queues</text>

  <rect class="ext" x="920" y="475" width="160" height="80" rx="8"/>
  <text class="t" x="1000" y="510" text-anchor="middle">Battle.net API</text>
  <text class="s" x="1000" y="529" text-anchor="middle">gear and characters</text>

  <!-- Edges: web client -->
  <line class="edge" x1="200" y1="200" x2="518" y2="200" marker-end="url(#ar)"/>
  <text class="lbl" x="360" y="192" text-anchor="middle">HTTPS + session cookie</text>
  <line class="edge d" x1="180" y1="150" x2="262" y2="112" marker-end="url(#ard)"/>
  <text class="lbl" x="196" y="126" text-anchor="middle">login</text>
  <line class="edge d" x1="442" y1="90" x2="518" y2="90" marker-start="url(#ard)" marker-end="url(#ard)"/>
  <text class="lbl" x="480" y="82" text-anchor="middle">roles</text>
  <line class="edge" x1="605" y1="120" x2="605" y2="158" marker-end="url(#ar)"/>
  <text class="lbl" x="613" y="143">creates session</text>

  <!-- Edges: Discord -->
  <line class="edge d" x1="202" y1="440" x2="258" y2="440" marker-start="url(#ard)" marker-end="url(#ard)"/>
  <text class="lbl" x="230" y="432" text-anchor="middle">uses</text>
  <line class="edge d" x1="440" y1="345" x2="518" y2="345" marker-end="url(#ard)"/>
  <text class="lbl" x="480" y="337" text-anchor="middle">clicks</text>
  <line class="edge d" x1="520" y1="378" x2="442" y2="378" marker-end="url(#ard)"/>
  <text class="lbl" x="480" y="394" text-anchor="middle">posts</text>
  <line class="edge d" x1="520" y1="500" x2="442" y2="500" marker-end="url(#ard)"/>
  <text class="lbl" x="480" y="492" text-anchor="middle">DMs</text>

  <!-- Edges: services to domain core -->
  <line class="edge a" x1="690" y1="200" x2="728" y2="200" marker-end="url(#ara)"/>
  <line class="edge a" x1="690" y1="360" x2="728" y2="360" marker-end="url(#ara)"/>
  <polyline class="edge a" points="690,490 785,490 785,452" marker-end="url(#ara)"/>

  <!-- Edges: core to data -->
  <line class="edge" x1="840" y1="210" x2="918" y2="210" marker-end="url(#ar)"/>
  <text class="lbl" x="880" y="202" text-anchor="middle">read/write</text>
  <line class="edge" x1="840" y1="370" x2="918" y2="370" marker-end="url(#ar)"/>
  <text class="lbl" x="880" y="362" text-anchor="middle">queues</text>

  <!-- Edge: worker to Battle.net -->
  <line class="edge" x1="690" y1="530" x2="918" y2="530" marker-end="url(#ar)"/>
  <text class="lbl" x="805" y="522" text-anchor="middle">reads gear, 12 h before</text>

  <!-- Legend -->
  <rect class="box" x="40" y="602" width="22" height="12" rx="2"/>
  <text class="leg" x="70" y="612">Our system</text>
  <rect class="core" x="170" y="602" width="22" height="12" rx="2"/>
  <text class="leg" x="200" y="612">Shared rules</text>
  <rect class="disc" x="310" y="602" width="22" height="12" rx="2"/>
  <text class="leg" x="340" y="612">Discord platform</text>
  <rect class="ext" x="470" y="602" width="22" height="12" rx="2"/>
  <text class="leg" x="500" y="612">External service</text>
</svg>
